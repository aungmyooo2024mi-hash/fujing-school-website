<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>彬乌伦佛经学校 - 教务数据管理综合后台</title>
  <meta name="description"
    content="彬乌伦佛经学校官方网站提供2026学年最新华文教育课程、新生报名须知、师资招聘公告及校园风采展示。学校致力于弘扬中华文化，推动缅中双语教育，为学生打造优质的学习发展与成长环境。">
  <meta name="keywords" content="彬乌伦佛经学校,缅甸华文学校,彬乌伦学校招生,缅甸中文培训,缅中双语学校">
  <link rel="shortcut icon" href="./image/45a2c44216f7de784ade62aa60292dd7.jpg" type="image/x-icon">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      padding: 30px;
      margin: 0;
      color: #333;
    }

    .login-box {
      max-width: 400px;
      background: white;
      padding: 40px;
      border-radius: 12px;
      margin: 120px auto 0;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    /* 综合管理大舱 */
    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
      padding: 30px;
      display: none;
      position: relative;
    }

    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    .header-area h2 {
      margin: 0;
      color: #1e293b;
    }

    /* 功能导航切换页 (Tabs) */
    .tab-menu {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      padding: 10px 20px;
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      color: #475569;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #007bff;
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 表单与表格通用样式 */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #4a5568;
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn {
      padding: 12px 24px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .btn:hover {
      background: #0056b3;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* 数据表格漂亮排版 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
      text-align: left;
    }

    th,
    td {
      padding: 12px 15px;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background: #f8fafc;
      color: #64748b;
      font-weight: bold;
    }

    tr:hover {
      background: #f8fafc;
    }

    .no-data {
      text-align: center;
      color: #94a3b8;
      padding: 30px;
      font-style: italic;
    }
  </style>
</head>

<body>

  <div class="login-box" id="loginView">
    <h2>🔑 教务安全后台登录</h2>
    <div class="form-group">
      <label>管理账号</label>
      <input type="text" id="login_username" placeholder="请输入管理员账号">
    </div>
    <div class="form-group">
      <label>登录密码</label>
      <input type="password" id="login_password" placeholder="请输入安全验证密码" onkeydown="if(event.keyCode==13) doLogin()">
    </div>
    <button class="btn" style="width:100%" onclick="doLogin()">安全登录验证</button>
  </div>

  <div class="admin-container" id="adminContainerView">
    <div class="header-area">
      <h2>🏫 彬乌伦佛经学校 · 教务总控制台</h2>
      <button class="logout-btn" onclick="doLogout()">退出系统 🚪</button>
    </div>

    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('news-tab')">📰 发布校园新闻</button>
      <button class="tab-btn" onclick="switchTab('enroll-tab')">👶 查看新生预报名列表</button>
      <button class="tab-btn" onclick="switchTab('teacher-tab')">💼 查看教师应聘简历</button>
    </div>

    <div id="news-tab" class="tab-content active">
      <div class="form-group">
        <label>新闻标题</label>
        <input type="text" id="news_title" placeholder="请输入新闻公告标题">
      </div>
      <div class="form-group">
        <label>分类归属</label>
        <select id="news_tag">
          <option value="校园">校园要闻 (前台带大图封面)</option>
          <option value="招生">招生通知 (前台简洁通知行)</option>
          <option value="招聘">师资招聘 (前台简洁通知行)</option>
        </select>
      </div>
      <div class="form-group">
        <label style="font-weight: normal; cursor: pointer;">
          <input type="checkbox" id="news_urgent"> 设置为【🔥 紧急】公告
        </label>
      </div>
      <div class="form-group">
        <label>正文跳转链接 (🔗 微信公众号/PDF网址)</label>
        <input type="text" id="news_url" placeholder="请在这里粘贴微信公众号文章链接，无链接可填 #">
      </div>
      <div class="form-group">
        <label>内容简介 / 导语</label>
        <textarea id="news_summary" rows="4" placeholder="请输入简短的摘要描述..."></textarea>
      </div>
      <button class="btn" onclick="publishNews()">同步同步发布到官网首页</button>
    </div>

    <div id="enroll-tab" class="tab-content">
      <h3>👶 官网实时接收的新生预报名登记表</h3>
      <p style="color:#64748b; font-size:13px;">提示：数据已在服务器端写入《新生报名表.xlsx》，以下展示最新递交的动态记录：</p>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>报名时间</th>
              <th>学生姓名</th>
              <th>年龄</th>
              <th>报读年级</th>
              <th>家长电话</th>
              <th>微信/联系方式</th>
              <th>居住区域</th>
              <th>备注说明</th>
            </tr>
          </thead>
          <tbody id="enroll-table-body">
          </tbody>
        </table>
      </div>
    </div>

    <div id="teacher-tab" class="tab-content">
      <h3>💼 官网实时收到的教师应聘简历库</h3>
      <p style="color:#64748b; font-size:13px;">提示：数据已在服务器端写入《教师应聘表.xlsx》：</p>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>投递时间</th>
              <th>应聘老师姓名</th>
              <th>意向授课科目</th>
              <th>联系电话</th>
            </tr>
          </thead>
          <tbody id="teacher-table-body">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 检查登录状态
    document.addEventListener("DOMContentLoaded", function () {
      fetch('http://127.0.0.1:5000/api/check_login', { credentials: 'include' })
        .then(res => res.json())
        .then(data => { if (data.is_logged_in) showDashboard(); });
    });

    // 登录
    function doLogin() {
      const u = document.getElementById('login_username').value.trim();
      const p = document.getElementById('login_password').value;
      fetch('http://127.0.0.1:5000/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
        credentials: 'include'
      })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") showDashboard();
          else alert(data.message);
        });
    }

    // 登出
    function doLogout() {
      fetch('http://127.0.0.1:5000/api/logout', { method: 'POST', credentials: 'include' })
        .then(() => location.reload());
    }

    // 激活后台大舱
    function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('adminContainerView').style.display = 'block';
      fetchAdminData(); // 顺手把表格数据拉下来
    }

    // 选项卡切换控制
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // 从安全接口向后端索要 Excel 里的报名与招聘数据
    function fetchAdminData() {
      fetch('http://127.0.0.1:5000/api/admin/get_data', { credentials: 'include' })
        .then(res => {
          if (res.status === 403) { location.reload(); return; }
          return res.json();
        })
        .then(res => {
          if (res && res.status === "success") {
            // 1. 渲染报名表
            const enrollBody = document.getElementById('enroll-table-body');
            if (res.enrollments.length === 0) {
              enrollBody.innerHTML = `<tr><td colspan="8" class="no-data">目前还没有家长在网上提交预报名申请</td></tr>`;
            } else {
              enrollBody.innerHTML = res.enrollments.map(x => `
                        <tr>
                            <td>${x['报名时间'] || ''}</td><td><strong>${x['学生姓名'] || ''}</strong></td>
                            <td>${x['年龄'] || ''} 岁</td><td><span style="color:#007bff;font-weight:bold;">${x['报读年级'] || ''}</span></td>
                            <td>${x['家长电话'] || ''}</td><td>${x['微信/联系方式'] || ''}</td>
                            <td>${x['居住区域'] || ''}</td><td style="color:#666;font-size:13px;">${x['备注说明'] || '无'}</td>
                        </tr>
                    `).join('');
            }

            // 2. 渲染招聘表
            const teacherBody = document.getElementById('teacher-table-body');
            if (res.teachers.length === 0) {
              teacherBody.innerHTML = `<tr><td colspan="4" class="no-data">目前还没有收到任何老师的应聘简历</td></tr>`;
            } else {
              teacherBody.innerHTML = res.teachers.map(x => `
                        <tr>
                            <td>${x['投递时间'] || ''}</td><td><strong>${x['应聘老师'] || ''}</strong></td>
                            <td><span style="background:#e1f5fe;color:#0288d1;padding:3px 8px;border-radius:4px;">${x['意向科目'] || ''}</span></td>
                            <td>${x['电话号码'] || ''}</td>
                        </tr>
                    `).join('');
            }
          }
        });
    }

    // 固有的发布新闻函数
    function publishNews() {
      const title = document.getElementById('news_title').value.trim();
      const tag = document.getElementById('news_tag').value;
      const summary = document.getElementById('news_summary').value.trim();
      const url = document.getElementById('news_url').value.trim();
      const urgent = document.getElementById('news_urgent').checked ? "1" : "0";

      if (!title || !summary) { alert("标题和摘要内容不能为空！"); return; }

      fetch('http://127.0.0.1:5000/api/add_news', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, tag, summary, url: url ? url : "#", urgent }),
        credentials: 'include'
      })
        .then(res => res.json())
        .then(data => {
          alert(data.message);
          document.getElementById('news_title').value = "";
          document.getElementById('news_summary').value = "";
          document.getElementById('news_url').value = "";
          document.getElementById('news_urgent').checked = false;
        });
    }
  </script>
</body>

</html>
